<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMON - Attack Surface Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #0a0e17;
            color: #c9d1d9;
            min-height: 100vh;
        }

        /* --- Header --- */
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 20px;
            color: #58a6ff;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: 12px;
            color: #8b949e;
        }

        /* --- Search section --- */
        .search-section {
            max-width: 700px;
            margin: 60px auto 40px;
            padding: 0 24px;
            text-align: center;
        }
        .search-section h2 {
            font-size: 28px;
            color: #e6edf3;
            margin-bottom: 8px;
        }
        .search-section p {
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .search-bar {
            display: flex;
            gap: 8px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus {
            border-color: #58a6ff;
        }
        .search-bar input::placeholder {
            color: #484f58;
        }
        .search-bar button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .search-bar button:hover { background: #2ea043; }
        .search-bar button:disabled {
            background: #21262d;
            color: #484f58;
            cursor: not-allowed;
        }

        /* --- Progress --- */
        .progress-section {
            max-width: 700px;
            margin: 0 auto 24px;
            padding: 0 24px;
            display: none;
        }
        .progress-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px 20px;
        }
        .progress-bar .status-text {
            font-size: 14px;
            color: #58a6ff;
        }
        .progress-bar .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #30363d;
            border-top: 2px solid #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Results --- */
        .results-section {
            max-width: 900px;
            margin: 0 auto 60px;
            padding: 0 24px;
            display: none;
        }

        /* Risk score card */
        .risk-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .risk-score-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .risk-critical { background: #da3633; color: #fff; }
        .risk-high { background: #d29922; color: #0a0e17; }
        .risk-medium { background: #e3b341; color: #0a0e17; }
        .risk-low { background: #238636; color: #fff; }
        .risk-info { background: #30363d; color: #8b949e; }
        .risk-details h3 { font-size: 18px; color: #e6edf3; margin-bottom: 4px; }
        .risk-details p { color: #8b949e; font-size: 13px; }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 24px;
            font-weight: 700;
            color: #e6edf3;
        }
        .stat-card .label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }

        /* Tables */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #e6edf3;
            margin: 24px 0 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #21262d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        th, td {
            padding: 10px 14px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #21262d;
        }
        th {
            background: #0d1117;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        td { color: #c9d1d9; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #1c2128; }

        /* Severity badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-critical { background: #da3633; color: #fff; }
        .badge-high { background: #d29922; color: #0a0e17; }
        .badge-medium { background: #e3b341; color: #0a0e17; }
        .badge-low { background: #238636; color: #fff; }
        .badge-info { background: #30363d; color: #8b949e; }

        /* Action buttons */
        .action-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-primary {
            background: #238636;
            color: #fff;
            border-color: #238636;
        }
        .btn-primary:hover { background: #2ea043; }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
        }
        .btn-secondary:hover { background: #30363d; }

        /* Clickable rows */
        tr.clickable { cursor: pointer; }
        tr.clickable:hover td { background: #1c2128; }

        /* Error */
        .error-msg {
            background: #2d1b1b;
            border: 1px solid #da3633;
            color: #f85149;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        /* History */
        .history-section {
            max-width: 900px;
            margin: 0 auto 60px;
            padding: 0 24px;
        }
        .history-section .section-title { margin-top: 0; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: #484f58;
            font-size: 12px;
            border-top: 1px solid #21262d;
        }

        /* DNS signals */
        .dns-signals {
            margin-top: 12px;
        }
        .signal-item {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .signal-item .signal-title {
            font-weight: 600;
            color: #e6edf3;
        }
        .signal-item .signal-detail {
            color: #8b949e;
            font-size: 12px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🎯 ASMON</h1>
            <span class="subtitle">Attack Surface Monitor</span>
        </div>
        <span class="subtitle">Asmon</span>
    </div>

    <!-- Search -->
    <div class="search-section">
        <h2>🔎 Scan any domain or IP</h2>
        <p>Free passive scan - no login required. Discovers subdomains, open ports, CVEs, and security risks.</p>
        <div class="search-bar">
            <input type="text" id="targetInput" placeholder="example.com or 1.2.3.4" autocomplete="off">
            <button id="scanBtn" onclick="startScan()">🔍 Scan</button>
        </div>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Progress -->
    <div class="progress-section" id="progressSection">
        <div class="progress-bar">
            <span class="spinner"></span>
            <span class="status-text" id="progressText">Starting scan...</span>
        </div>
    </div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">
        <div class="risk-card" id="riskCard"></div>
        <div class="action-bar" id="actionBar"></div>
        <div class="stats-row" id="statsRow"></div>

        <h3 class="section-title">💻 Hosts</h3>
        <table id="hostsTable">
            <thead><tr><th>IP</th><th>Hostnames</th><th>Ports</th><th>CVEs</th><th>Source</th></tr></thead>
            <tbody></tbody>
        </table>

        <div id="cvesContainer"></div>
        <div id="dnsContainer"></div>
    </div>

    <!-- History -->
    <div class="history-section" id="historySection">
        <h3 class="section-title">📋 Recent Scans</h3>
        <table id="historyTable">
            <thead><tr><th>Target</th><th>Date</th><th>Hosts</th><th>CVEs</th><th>Risk</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer">ASMON - Attack Surface Monitor | Asmon</div>

    <script>
        let pollTimer = null;

        // --- Init ---
        document.getElementById('targetInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startScan();
        });
        loadHistory();

        // --- Start scan ---
        async function startScan() {
            const target = document.getElementById('targetInput').value.trim();
            if (!target) return;

            const btn = document.getElementById('scanBtn');
            btn.disabled = true;
            btn.textContent = '🔍 Scanning...';

            hideEl('errorMsg');
            hideEl('resultsSection');
            showEl('progressSection');
            document.getElementById('progressText').textContent = 'Starting scan...';

            try {
                const resp = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target }),
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'Scan failed');
                }

                const data = await resp.json();
                pollScan(data.scan_id);
            } catch (err) {
                showError(err.message);
                resetBtn();
            }
        }

        // --- Poll scan status ---
        function pollScan(scanId) {
            if (pollTimer) clearInterval(pollTimer);

            pollTimer = setInterval(async () => {
                try {
                    const resp = await fetch(`/api/scan/${scanId}`);
                    const data = await resp.json();

                    document.getElementById('progressText').textContent = data.progress;

                    if (data.status === 'completed') {
                        clearInterval(pollTimer);
                        hideEl('progressSection');
                        renderResults(data.snapshot);
                        showEl('resultsSection');
                        resetBtn();
                        loadHistory();
                    } else if (data.status === 'failed') {
                        clearInterval(pollTimer);
                        hideEl('progressSection');
                        showError(data.error || 'Scan failed');
                        resetBtn();
                    }
                } catch (err) {
                    clearInterval(pollTimer);
                    showError('Connection lost');
                    resetBtn();
                }
            }, 1500);
        }

        // --- Render results ---
        function renderResults(snap) {
            // Risk card
            const risk = snap.risk_score || { score: 0, level: 'info', factors: [] };
            const riskClass = `risk-${risk.level}`;
            const lvlEmoji = { critical: '🔴', high: '🟡', medium: '🟡', low: '🟢', info: '⚪' }[risk.level] || '⚪';
            document.getElementById('riskCard').innerHTML = `
                <div class="risk-score-circle ${riskClass}">${risk.score}</div>
                <div class="risk-details">
                    <h3>${lvlEmoji} ${esc(snap.target)} - ${risk.level.toUpperCase()} Risk</h3>
                    <p>${risk.factors ? risk.factors.slice(0, 3).join(' | ') : '✔️ No significant risk factors'}</p>
                </div>
            `;

            // Action buttons
            document.getElementById('actionBar').innerHTML = `
                <a class="btn btn-primary" href="/detail/${snap.snapshot_id}">🔍 View Full Details</a>
                <a class="btn btn-secondary" href="/api/report/${snap.snapshot_id}">⬇ Download Report</a>
            `;

            // Stats
            const totalCves = snap.hosts.reduce((sum, h) => sum + (h.cves ? h.cves.length : 0), 0);
            const totalPorts = snap.hosts.reduce((sum, h) => sum + (h.services ? h.services.length : 0), 0);
            const totalSignals = snap.hosts.reduce((sum, h) => {
                return sum + (h.web_risks ? h.web_risks.reduce((s, r) => s + (r.signals ? r.signals.length : 0), 0) : 0);
            }, 0);

            document.getElementById('statsRow').innerHTML = `
                <div class="stat-card"><div class="number">${snap.hosts.length}</div><div class="label">💻 Hosts</div></div>
                <div class="stat-card"><div class="number">${totalPorts}</div><div class="label">⚙️ Open Ports</div></div>
                <div class="stat-card"><div class="number">${totalCves}</div><div class="label">⚠️ CVEs</div></div>
                <div class="stat-card"><div class="number">${totalSignals}</div><div class="label">🔔 Risk Signals</div></div>
            `;

            // Hosts table
            const hostsBody = document.querySelector('#hostsTable tbody');
            hostsBody.innerHTML = '';
            for (const host of snap.hosts) {
                const ports = (host.services || []).map(s => s.port).join(', ') || '-';
                const cveCount = (host.cves || []).length;
                const hostnames = (host.hostnames || []).join(', ') || '-';
                hostsBody.innerHTML += `
                    <tr>
                        <td>${esc(host.ip)}</td>
                        <td>${esc(hostnames)}</td>
                        <td>${esc(ports)}</td>
                        <td>${cveCount}</td>
                        <td>${esc(host.source)}</td>
                    </tr>
                `;
            }

            // CVEs table
            const allCves = [];
            for (const host of snap.hosts) {
                for (const cve of (host.cves || [])) {
                    allCves.push({ ...cve, ip: host.ip });
                }
            }
            const cvesContainer = document.getElementById('cvesContainer');
            if (allCves.length > 0) {
                allCves.sort((a, b) => (b.cvss_score || 0) - (a.cvss_score || 0));
                const rows = allCves.slice(0, 100).map(c => `
                    <tr>
                        <td>${esc(c.cve_id)}</td>
                        <td><span class="badge badge-${c.severity || 'info'}">${c.severity || 'unknown'}</span></td>
                        <td>${c.cvss_score != null ? c.cvss_score.toFixed(1) : '-'}</td>
                        <td>${esc(c.ip)}</td>
                        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.description || '-')}</td>
                    </tr>
                `).join('');
                cvesContainer.innerHTML = `
                    <h3 class="section-title">⚠️ CVEs (${allCves.length})</h3>
                    <table><thead><tr><th>CVE ID</th><th>Severity</th><th>CVSS</th><th>Host</th><th>Description</th></tr></thead>
                    <tbody>${rows}</tbody></table>
                `;
            } else {
                cvesContainer.innerHTML = '';
            }

            // DNS / web risk signals
            const dnsContainer = document.getElementById('dnsContainer');
            const allSignals = [];
            for (const host of snap.hosts) {
                for (const wr of (host.web_risks || [])) {
                    for (const sig of (wr.signals || [])) {
                        allSignals.push({ ...sig, host: wr.host });
                    }
                }
            }
            if (allSignals.length > 0) {
                const items = allSignals.map(s => `
                    <div class="signal-item">
                        <span class="badge badge-${s.severity || 'info'}">${s.severity}</span>
                        <span class="signal-title">${esc(s.title)}</span>
                        <div class="signal-detail">${esc(s.detail)}</div>
                    </div>
                `).join('');
                dnsContainer.innerHTML = `
                    <h3 class="section-title">🔔 Security Signals (${allSignals.length})</h3>
                    <div class="dns-signals">${items}</div>
                `;
            } else {
                dnsContainer.innerHTML = '';
            }
        }

        // --- History ---
        async function loadHistory() {
            try {
                const resp = await fetch('/api/history?limit=10');
                const data = await resp.json();

                const tbody = document.querySelector('#historyTable tbody');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#484f58">No scans yet</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(e => `
                    <tr class="clickable" onclick="window.location='/detail/${e.snapshot_id}'">
                        <td>${esc(e.target)}</td>
                        <td>${new Date(e.captured_at).toLocaleString()}</td>
                        <td>${e.host_count}</td>
                        <td>${e.cve_count}</td>
                        <td>${e.risk_score != null ? `<span class="badge badge-${e.risk_level || 'info'}">${e.risk_score}</span>` : '-'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Failed to load history:', err);
            }
        }

        // --- Helpers ---
        function showEl(id) { document.getElementById(id).style.display = ''; }
        function hideEl(id) { document.getElementById(id).style.display = 'none'; }
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = '';
        }
        function resetBtn() {
            const btn = document.getElementById('scanBtn');
            btn.disabled = false;
            btn.textContent = '🔍 Scan';
        }
        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }
    </script>
</body>
</html>
